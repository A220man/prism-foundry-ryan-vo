[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-foundry-backend"
version = "1.0.0"
description = "Kronos: A Foundation Model for the Language of Financial Markets - Backend"
readme = "../README.md"
authors = [{name = "Ryan Vo", email = "ryandtvo@gmail.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.34",
    "alembic==1.13.2",
    "httpx==0.27.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.12",
    "python-dotenv==1.0.1",
    "redis==5.1.0",
    "numpy==2.1.2",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]